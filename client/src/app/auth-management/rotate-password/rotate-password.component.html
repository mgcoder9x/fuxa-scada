<!--
  Forced password-rotation template (design/12 §4 · REQ-17 AC-17.2/17.3, D-045).
  - three labeled password inputs (current / new / confirm) + submit + non-interactive error region.
  - role="alert" aria-live="assertive" region renders the translated generic errorKey only when set.
  - submit disabled while !canSubmit(); aria-busy reflects pending.
  - Security: no server text rendered — the error region renders a translated i18n KEY only.
-->
<form class="auth-login" [formGroup]="form" (ngSubmit)="onSubmit()" [attr.aria-busy]="pending">

    <h1 class="auth-login__title">{{ 'rotate.title' | translate }}</h1>
    <p class="auth-login__hint">{{ 'rotate.hint' | translate }}</p>

    <div class="auth-login__field">
        <label class="auth-login__label" for="auth-rotate-current">
            {{ 'rotate.current' | translate }}
        </label>
        <input id="auth-rotate-current"
               class="auth-login__input"
               type="password"
               formControlName="currentPassword"
               autocomplete="current-password"
               autofocus
               [attr.aria-invalid]="form.controls.currentPassword.touched && form.controls.currentPassword.invalid" />
    </div>

    <div class="auth-login__field">
        <label class="auth-login__label" for="auth-rotate-new">
            {{ 'rotate.new' | translate }}
        </label>
        <input id="auth-rotate-new"
               class="auth-login__input"
               type="password"
               formControlName="newPassword"
               autocomplete="new-password"
               [attr.aria-invalid]="form.controls.newPassword.touched && form.controls.newPassword.invalid" />
    </div>

    <div class="auth-login__field">
        <label class="auth-login__label" for="auth-rotate-confirm">
            {{ 'rotate.confirm' | translate }}
        </label>
        <input id="auth-rotate-confirm"
               class="auth-login__input"
               type="password"
               formControlName="confirmPassword"
               autocomplete="new-password"
               [attr.aria-invalid]="form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid" />
    </div>

    <div class="auth-login__error" role="alert" aria-live="assertive">
        <span *ngIf="errorKey">{{ errorKey | translate }}</span>
    </div>

    <button class="auth-login__submit"
            type="submit"
            [disabled]="!canSubmit()"
            [attr.aria-busy]="pending">
        {{ 'rotate.submit' | translate }}
    </button>

</form>
